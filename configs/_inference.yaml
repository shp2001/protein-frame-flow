# Configuration for inference on SE(3) diffusion experiments.
defaults:
  - base
  - _self_

inference:
  base_configs: /home/psh/protein-frame-flow/configs/base.yaml
  predict_dir: /home/psh/protein-frame-flow/inference_outputs/
  inference_subdir: run_${now:%Y-%m-%d}_${now:%H-%M-%S}

  # cropping 
  ab_max_num_res: 400 
  crop_ab: False
  general_max_num_res: 500
  max_mask_residues: 200

  # Use this to write with date-time stamp.
  name: run_${now:%Y-%m-%d}_${now:%H-%M}
  seed: 12
  task: inpainting
  output_dir: /home/psh/protein-frame-flow/inference_outputs/

  # Choose checkpoint path
  ckpt_path: /home/psh/protein-frame-flow/ckpt/v2.3.2.2_affinity/v2.3.2.2_dist_weighted_wo_ag_mask/2026-02-20_13-57-27/epoch=28-step=1827.ckpt
  num_gpus: 1

  # trans rot perturbation 
  perturbation: False 

  interpolant:
    use_prmsd: False
    min_t: 1e-2
    max_shift: 5
    max_angle_deg: 20
    rots:
      corrupt: True
      sample_schedule: exp
      exp_rate: 10
    trans:
      corrupt: True
      sample_schedule: linear
    sampling:
      num_timesteps: 30
    self_condition: True

    inference_time_scaling:
      use: False
      grad_weight: 1.0
      t_scaling: True
    twisting:
      use: False
      t_min: 0.2
      scale: 1.
      # scale_w_t: ot
      r_t: 1
      potential_trans: True
      potential_rot: True
      update_trans: True
      update_rot: True
      max_rot_grad_norm: 1000
      align: True
      motif_loc: False
      max_offsets: 1000
      # num_rots: 100
      num_rots: 1
      # scale_rots: math.inf
      scale_rots: 0.
      # scale_rots: 0.1
      obs_noise: 0.

  samples:
 
    # Number of backbone samples per sequence length.
    samples_per_length: 10

    # Minimum sequence length to sample.
    min_length: 60

    # Maximum sequence length to sample.
    max_length: 10000

    # gap between lengths to sample. i.e. this script will sample all lengths
    # in range(min_length, max_length, length_step)
    length_step: 1

    # Subset of lengths to sample. If null, sample all targets.
    length_subset: null

    overwrite: False

    # CSV path for scaffolding targets.
    csv_path: /home/psh/data/affinity/ppb_affinity/meta/metadata_test.csv
    csv_path_affinity: /home/psh/data/affinity/ppb_affinity/affinity_test.csv 
    # Number of scaffolds to sample per target.
    samples_per_target: 1

    # Batch size when sampling from the model
    batch_size: 1
    num_workers: 8
    prefetch_factor: 4

    # Subset of targets to scaffold.
    target_subset: null  # e.g. ['5TPN']
