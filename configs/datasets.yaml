shared:
  seed: 123
  max_cache_size: 100_000
  samples_per_eval_length: 5
  num_eval_lengths : 8
  max_eval_length: None

  # Scaffolding parameters
  min_motif_percent: 1
  max_motif_percent: 1

  # General Loop PPI dataset or Antibody Dataset or Nanobody Dataset
  mode: affinity
  loop_dir: /home/psh/data/loop_ppi/contact_index_7_to_24_tol5_wo_edge
  
  # masking scheduling 
  init_masking_prob: 0.3 
  masking_increase_ratio: 0.02
scope_dataset:
  seed: ${shared.seed}
  csv_path: ./metadata/scope_metadata.csv
  max_cache_size: ${shared.max_cache_size}
  cache_num_res: 0
  add_plddt_mask: False
  max_eval_length: ${shared.max_eval_length}
  inpainting_percent: 1.0

  # Eval parameters
  samples_per_eval_length: ${shared.samples_per_eval_length}
  num_eval_lengths: ${shared.num_eval_lengths}

  # Filtering
  filter:
    max_num_res: 200
    min_num_res: 60

  # Scaffolding
  min_motif_percent: ${shared.min_motif_percent}
  max_motif_percent: ${shared.max_motif_percent} 


pdb_dataset:
  seed: ${shared.seed}
  train_csv_path: /home/psh/data/affinity/ppb_affinity/affinity_train_ppb.csv
  valid_csv_path: /home/psh/data/affinity/ppb_affinity/affinity_valid_ppb.csv

  train_meta_path: /home/psh/data/affinity/ppb_affinity/meta/metadata_train_ppb.csv
  valid_meta_path: /home/psh/data/affinity/ppb_affinity/meta/metadata_valid_ppb.csv

  pairs_per_cluster: 3

  max_cache_size: ${shared.max_cache_size}
  cache_num_res: 10000000
  inpainting_percent: 1.0

  add_plddt_mask: False
  max_eval_length: ${shared.max_eval_length}

  # Eval parameters
  samples_per_eval_length: ${shared.samples_per_eval_length}
  num_eval_lengths: ${shared.num_eval_lengths}

  # Cropping 
  crop_ab: True
  ab_threshold: 40
  general_threshold: 40
  ab_max_num_res: 300
  general_max_num_res: 400
  
  # build scaffold_idx
  not_mask_ag_blocks: True
  mask_ag_mut_block: True
  max_interface_mask_ratio: 0.8
  min_anchor_residues: 4

  # Filtering
  filter:
    max_num_res: 1200
    min_num_res: 100
    max_num_chain: 6
    max_mask_residues: 200
    max_coil_percent: 1.0
    rog_quantile: 1.0
    # oligomeric: ['monomeric', 'heteromer']
    # num_chains: [2,3,4,5,6,7]

  # Scaffolding
  min_motif_percent: ${shared.min_motif_percent} 
  max_motif_percent: ${shared.max_motif_percent}
  
