defaults:
  - _self_
  - datasets
  - model

data:

  # Available tasks: hallucination, inpainting
  task: inpainting

  # Available tasks: pdb, scope
  dataset: pdb

  loader:
    num_workers: 6
    prefetch_factor: 10

  hotspot:
    threshold: 8
    hotspot_noise:
      masking_ratio: 0.2
      false_hotspot_ratio: 0.2
      noise_range: 4

  sampler:
    # Setting for 48GB GPUs
    max_batch_size: 40
    max_num_res_squared: 200_000
    ab_max_num_res: ${pdb_dataset.ab_max_num_res}
    general_max_num_res: ${pdb_dataset.general_max_num_res}
    
interpolant:
  min_t: 1e-2
  sample_t_mode: uniform # one of ["uniform", "beta_mixed", "beta_revese_mixed", "logit_normal"]
  max_angle_deg: 0
  max_shift: 0
  twisting:
    use: False

  rots:
    corrupt: True
    sample_schedule: exp
    exp_rate: 10

  trans:
    corrupt: True
    batch_ot: True
    sample_schedule: linear
    sample_temp: 1.0
    vpsde_bmin: 0.1
    vpsde_bmax: 20.0
    potential: null
    potential_t_scaling: False
    rog:
      weight: 10.0
      cutoff: 5.0

  inference_time_scaling:
    use: False

  sampling:
    num_timesteps: 30
    do_sde: False

  save_traj: False 

mini_rollout:
  min_t: 1e-2

  twisting:
    use: False

  rots:
    corrupt: True
    sample_schedule: exp
    exp_rate: 10

  trans:
    corrupt: True
    batch_ot: True
    sample_schedule: linear
    sample_temp: 1.0
    vpsde_bmin: 0.1
    vpsde_bmax: 20.0
    potential: null
    potential_t_scaling: False
    rog:
      weight: 10.0
      cutoff: 5.0

  inference_time_scaling:
    use: False
  sampling:
    num_timesteps: 15
    do_sde: False

  use_prmsd: ${model.confidence_head.use_confidence}
  save_traj: False 
  
experiment:
  add_modules: False
  debug: False
  seed: 123
  num_devices: 4
  warm_start: null
  warm_start_cfg_override: False
  training:
    mask_plddt: True
    r3_loss_weight: 2.0
    atom_scale: 0.1
    r3_scale: 0.1
    t_normalize_clip: 0.9

    aux_loss_weight: 1.0
    viol_loss_weight: 0.1

    use_local_pair_feat_loss: ${model.distogram_head.use_pair_head}
    distogram_loss_weight: 0.05 
    # backbone
    use_dist_mat_loss: True
    dist_mat_loss_weight: 1.0
    use_loop_bb_loss: True
    loop_bb_loss_weight: 0.5 
    use_orientation_loss: True
    orientation_loss_weight: 2.0

    # side chain
    use_loop_sc_loss: True
    loop_sc_loss_weight: 0.25
    use_local_dist_mat_loss: False
    local_dist_mat_loss_weight: 0.0
    # violation_backbone 
    use_bond_loss: True 
    bond_length_loss_weight: 1.0 
    c_n_ca_loss_weight: 1.0 
    ca_c_n_loss_weight: 1.0 
    # violation_side chain
    use_all_atom_clash_loss: False
    all_atom_clash_loss_weight: 0.1
    use_within_clash_loss: True
    within_clash_loss_weight: 0.1

    bb_aux_loss_t_pass: 0.25
    sc_aux_loss_t_pass: 0.5
    bb_viol_loss_t_pass: 0.5
    sc_viol_loss_t_pass: 0.75
  
    # confidence loss 
    plddt:
      min_bin: 0
      max_bin: 1
      no_bins: 50
      threshold: 15
      eps: 1e-6
      normalize: True
      reduction: mean

    pae:
      min_bin: 0
      max_bin: 32
      no_bins: 64
      eps: 1e-6
      reduction: mean

  wandb:
    name: CDRFlow_v2.4.0_general_stage1
    project: v2.4.0
  optimizer:
    warmup_steps: 0
    decay_steps: 250_000
    min_lr: 1e-4
    max_lr: 1e-3
  trainer:
    overfit_batches: 0
    min_epochs: 1 # prevents early stopping
    max_epochs: 300
    accelerator: gpu
    log_every_n_steps: 1
    deterministic: False
    check_val_every_n_epoch: 1
    accumulate_grad_batches: 1
  checkpointer:
    dirpath: /home/psh/protein-frame-flow/ckpt/${experiment.wandb.project}/${experiment.wandb.name}/${now:%Y-%m-%d}_${now:%H-%M-%S}
    save_last: True
    save_top_k: 3
    monitor: valid/h3_trans_loss
    mode: min
  # Keep this null. Will be populated at runtime.
  inference_dir: null
