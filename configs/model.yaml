model:
  node_embed_size: 384
  edge_embed_size: 128
  num_cycles: 3
  n_blocks: 3 # structure module 
  symmetric: False
  scaling_nm_ang: False 

  node_features:
    c_s: ${model.node_embed_size}
    c_pos_emb: 128
    c_timestep_emb: 128
    max_num_res: 2000
    timestep_int: 1000
    embed_chain: False

  edge_features:
    single_bias_transition_n: 2
    c_s: ${model.node_embed_size}
    c_p: ${model.edge_embed_size}
    ref_pos_dim: 16
    relpos_k: 64
    relpos_dim: 73
    feat_dim: ${model.edge_embed_size}
    num_bins: 32
    self_condition: True
    embed_ref_pos: True
    embed_chain: False
    embed_diffuse_mask: True
    embed_unit_vector: True
    embed_distogram: True
    embed_self_condition: False

  pairformer: 
    n_blocks: 3
    n_heads: 16
    c_z: 128
    c_s: 384
    blocks_per_ckpt: null
    dropout: 0.2
    
  aa_enc:
    c_token: ${model.node_embed_size}
    has_s_z: True
    c_atom: 128
    c_atompair: 16
    c_s: ${model.node_embed_size}
    c_z: 128
    n_blocks: 3
    n_heads: 4
    n_queries: 32
    n_keys: 128
    blocks_per_ckpt: null

  ipa:
    c_s: ${model.node_embed_size}
    c_z: ${model.edge_embed_size}
    c_hidden: 16
    no_heads: 8
    no_qk_points: 8
    no_v_points: 12
    depth: 3

    seq_tfmr_num_heads: 8
    seq_tfmr_num_layers: 4

  local_triangle_attention_new:
    enable: True # true
    c_s: ${model.node_embed_size}
    c_z: ${model.edge_embed_size}
    c_rbf: 64
    c_gate_s: 16
    c_hidden: 128
    c_hidden_mul: 128
    no_heads: 4
    transition_n: 2
    k_neighbour: 32
    k_linear: 0 # residue index 상에서 앞뒤로 존재하는 얘들을 강제로 포함
    inf: 1e9
    pair_dropout: 0.25

  distogram_head: 
    c_z: ${model.edge_embed_size}
    num_bins: 32

  angle:
    c_resnet: 256
    no_resnet_blocks: 2
    no_angles: 7
    epsilon: 1.0e-07
    use_original_sm: true

  all_atom:
    n_blocks: 2
    d_single: 384
    d_hidden: 128
    atom_num: 14


  conditioning_module:
    c_s: ${model.node_embed_size}
    c_z: ${model.edge_embed_size}
    c_s_inputs: ${model.node_embed_size}
    c_noise_embedding: 128
    relpos_dim: 73
    num_bins: 32 # self conditioning distogram 


  confidence_head:
    use_confidence: False
    n_blocks: 3
    c_s: ${model.node_embed_size}
    c_z: ${model.edge_embed_size}
    c_s_inputs: ${model.node_embed_size}
    min_bins: 2.0
    max_bins: 32.0
    num_bins: 32
    blocks_per_ckpt: null